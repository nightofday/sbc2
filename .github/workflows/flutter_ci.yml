name: Flutter CI

on:
  workflow_dispatch:
  push:
    branches:
      - brian/full-system-integration
      - brian/inventory-consultation-alignment
      - brian/inventory-workflow-navigation
  pull_request:
    branches:
      - main
      - brian/supabase-database
      - brian/inventory-workflow-navigation

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
